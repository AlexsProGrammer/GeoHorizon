services:
  db:
    image: postgis/postgis:15-3.4
    container_name: geohorizon-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../data/postgres_data:/var/lib/postgresql
    networks:
      - horizon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: geohorizon-redis
    ports:
      - "16379:6379"
    command: redis-server --maxmemory-policy noeviction --maxmemory 256mb
    networks:
      - horizon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: geohorizon-api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    networks:
      - horizon-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: geohorizon-worker
    volumes:
      - ../data:/data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      VIEWSHED_ENGINE: ${VIEWSHED_ENGINE:-auto}
      WORKER_CONCURRENCY: "4"
    networks:
      - horizon-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: geohorizon-frontend
    ports:
      - "3002:3000"
    volumes:
      - ../frontend/src:/app/src
    networks:
      - horizon-net
    depends_on:
      - api
    restart: unless-stopped

networks:
  horizon-net:
    driver: bridge
